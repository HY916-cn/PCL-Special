name: Build special edition
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: special-edition-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57
        with:
          msbuild-architecture: x64
      - name: Build and package
        shell: pwsh
        env:
          PCL_CURSEFORGE_API_KEY: ${{ secrets.PCL_CURSEFORGE_API_KEY }}
        run: ./tools/Build.ps1
      - name: Verify Windows download and update behavior
        shell: pwsh
        env:
          PCL_EXPECT_CURSEFORGE_KEY: 'true'
        run: ./tools/SmokeTest.ps1 -ExecutablePath ./dist/PCL特别版-2.99.99.exe -WorkDirectory ./artifacts/smoke
      - name: Upload packages and verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PCL特别版-2.99.99
          retention-days: 30
          path: |
            dist/*
            artifacts/smoke/smoke-result.json
            artifacts/smoke/*.log
            artifacts/smoke/**/Log*.txt
